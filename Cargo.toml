[package]
name = "navidrome-listenbrainz-plugin"
version = "0.1.1"
edition = "2021"
description = "Two-way loved-track sync with ListenBrainz and rating sync from CritiqueBrainz"
authors = ["egecelikci"]
license = "GPL-3.0"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
nd-pdk = { git = "https://github.com/navidrome/navidrome", rev = "101145742f4762164202cb4858c9126258bdc463" }
extism-pdk = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
